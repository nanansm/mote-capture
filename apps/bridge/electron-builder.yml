appId: com.motekreatif.capture.bridge
productName: Mote Capture Bridge
copyright: Copyright © 2026 Mote Kreatif

directories:
  output: dist-installer
  buildResources: assets

files:
  - dist/**/*
  - assets/**/*
  - package.json
  - "!**/*.map"

asarUnpack:
  - "**/node_modules/sharp/**/*"
  - "**/node_modules/@img/**/*"

mac:
  category: public.app-category.photography
  icon: assets/icon.png
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  hardenedRuntime: false
  gatekeeperAssess: false

win:
  icon: assets/icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  # digiCamControl installer is bundled into the .exe and silently installed by
  # assets/installer.nsh if not already present. Drop the binary at
  # installer-deps/digiCamControl-setup.exe before building on Windows
  # (see installer-deps/README.md). win-scoped so the mac smoke build does not
  # need it.
  # ffmpeg.exe backs cameraMode "webcam-win" (Sony ZV-E10 over UVC — the body
  # has no PC Remote mode, so dshow is the only automatable path). Resolved at
  # runtime from process.resourcesPath by camera/webcam-win.ts.
  extraResources:
    - from: installer-deps/digiCamControl-setup.exe
      to: digiCamControl-setup.exe
    - from: installer-deps/ffmpeg.exe
      to: ffmpeg.exe

linux:
  icon: assets/icon.png
  target:
    - AppImage
    - deb
  category: Photography

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Mote Capture Bridge
  # Custom install/uninstall steps: bundle digiCamControl + kiosk Edge shortcuts.
  include: assets/installer.nsh
