<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mote Capture Bridge</title>
    <style>
      :root {
        --green-dark: #0f5132;
        --green: #198754;
        --green-light: #86efac;
        --bg: #fef9c3;
        --bg-soft: #fef9c360;
        --border: #d4d4d8;
        --muted: #71717a;
        --text: #18181b;
        --danger: #dc2626;
        --warn: #f59e0b;
        --card: #ffffff;
      }
      * { box-sizing: border-box; }
      html, body, #root {
        height: 100%;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 14px;
        color: var(--text);
        background: var(--bg);
      }
      h1, h2, h3 { color: var(--green-dark); margin: 0 0 8px; }
      h2 { font-size: 18px; font-weight: 600; }
      h3 { font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
      button {
        font: inherit;
        cursor: pointer;
        border-radius: 6px;
        padding: 8px 14px;
        background: var(--green-dark);
        color: var(--bg);
        border: 1px solid var(--green-dark);
      }
      button.secondary {
        background: white;
        color: var(--green-dark);
      }
      button.danger {
        background: var(--danger);
        border-color: var(--danger);
        color: white;
      }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      input, select, textarea {
        font: inherit;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: white;
        width: 100%;
      }
      label { font-size: 12px; font-weight: 600; color: var(--green-dark); text-transform: uppercase; letter-spacing: 0.04em; }
      .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
      .row { display: flex; gap: 8px; align-items: center; }
      .col { display: flex; flex-direction: column; gap: 6px; }
      .stack > * + * { margin-top: 12px; }
      .grid { display: grid; gap: 12px; }
      .muted { color: var(--muted); font-size: 12px; }
      code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
      .badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 9999px; font-size: 12px; font-weight: 600; }
      .badge.ok { background: var(--green-light); color: var(--green-dark); }
      .badge.err { background: #fecaca; color: var(--danger); }
      .badge.busy { background: #fde68a; color: #92400e; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
